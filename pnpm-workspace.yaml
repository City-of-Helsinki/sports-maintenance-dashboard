# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

overrides:
  serialize-javascript: ">=7.0.5"
  uuid: ">=11.1.1"
  browserslist: ">=4.28.8"
  fast-uri: ">=3.1.7"
  "@humanfs/node": ">=0.16.8"
  qs: ">=6.16.0"
  postcss-selector-parser: ">=6.1.3"

allowBuilds:
  core-js: true
  core-js-pure: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  - shell-quote@1.8.5
  - qs@6.16.0
