# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

overrides:
  # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, and GHSA-6pq8-jhm2-2vcw:
  # array-limit bypass and denial of service in parsing and comma stringification.
  qs: '>=6.16.1'
  serialize-javascript: ">=7.1.3"
  uuid: ">=11.1.1"
  'glob@>=9.0.0 <14.0.2': '^14.0.2'
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'

allowBuilds:
  '@parcel/watcher': false
  core-js: true
  core-js-pure: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  - shell-quote@1.8.5
